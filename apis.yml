name: Tenex AI
description: >-
  TENEX.AI is an AI-native, human-led Managed Detection and Response (MDR) provider that
  fuses agentic AI, automation, and elite human security analysts to run security operations
  at scale. Its platform triages every alert and investigates every threat, orchestrating
  workflows across 300+ security tools to deliver faster detection, high-fidelity triage,
  and autonomous response with human guardrails for Fortune 500 and Global 2000 enterprises.
  Backed by Andreessen Horowitz (a16z), Crosspoint Capital, and Shield Capital, TENEX.AI
  operates as a managed cybersecurity service rather than a public developer API platform;
  as of this enrichment pass it publishes no developer API, SDKs, or API documentation.
